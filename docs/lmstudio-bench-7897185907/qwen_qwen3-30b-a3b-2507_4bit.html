<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kanban Board</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* Custom Tailwind overrides and animations */
    :root {
      --primary-color: #6366f1;
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --border-color: #e5e7eb;
      --text-color: #1f2937;
      --hover-bg: #f3f4f6;
      --done-bg: #10b981;
      --done-text: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Segoe UI', sans-serif;
    }

    .kanban-column {
      min-height: 400px;
      background-color: var(--card-bg);
      border-radius: 0.5rem;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      overflow-y: auto;
      height: 100%;
    }

    .kanban-column:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      box-shadow: var(--shadow);
      cursor: move;
      transition: all 0.2s ease;
      position: relative;
      word-wrap: break-word;
    }

    .card:hover {
      box-shadow: 0 4px 8px -2px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .card.editing {
      background-color: #f0f4f8;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-color);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.3;
    }

    .card-actions {
      display: flex;
      gap: 0.25rem;
    }

    .card-actions button {
      background-color: transparent;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0;
      transition: color 0.2s ease;
    }

    .card-actions button:hover {
      color: #6366f1;
    }

    .card-actions button.delete {
      color: #ef4444;
    }

    .card-actions button.delete:hover {
      color: #dc2626;
    }

    .add-card {
      background-color: #f3f4f6;
      border: 2px dashed #d1d5db;
      border-radius: 0.375rem;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .add-card:hover {
      background-color: #e5e7eb;
      border-color: #9ca3af;
    }

    .add-card input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      background-color: #ffffff;
    }

    .add-card input:focus {
      outline: 2px solid var(--primary-color);
      outline-offset: -2px;
    }

    .done-card {
      background-color: var(--done-bg);
      color: var(--done-text);
      border-color: var(--done-bg);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
    }

    .done-card .card-title {
      color: var(--done-text);
    }

    .done-card .card-actions button {
      color: var(--done-text);
    }

    .done-card .card-actions button:hover {
      color: #ffffff;
    }

    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .confetti.active {
      opacity: 1;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #fbbf24;
      border-radius: 10%;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
      }
    }

    .column-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-color);
      margin-bottom: 0.75rem;
      padding: 0.5rem;
      background-color: #f3f4f6;
      border-radius: 0.375rem;
      text-align: center;
    }

    .column-title .icon {
      margin-right: 0.25rem;
    }
  </style>
</head>
<body class="bg-gray-50 p-4">
  <!-- Confetti overlay for when cards move to "Done" -->
  <div id="confetti" class="confetti"></div>

  <!-- Main Kanban Board Container -->
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">
      <i class="fas fa-tasks mr-2 text-blue-600"></i>
      Kanban Board
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Backlog Column -->
      <div class="kanban-column bg-white rounded-lg shadow-md p-4">
        <h2 class="column-title">
          <i class="fas fa-list-alt icon text-blue-600"></i>
          Backlog
        </h2>
        <div id="backlog" class="space-y-2">
          <!-- Cards will be added here dynamically -->
        </div>
        <div class="add-card" id="add-backlog">
          <i class="fas fa-plus-circle mr-1 text-green-500"></i>
          Add card
        </div>
      </div>

      <!-- In Progress Column -->
      <div class="kanban-column bg-white rounded-lg shadow-md p-4">
        <h2 class="column-title">
          <i class="fas fa-spinner icon text-yellow-600"></i>
          In Progress
        </h2>
        <div id="in-progress" class="space-y-2">
          <!-- Cards will be added here dynamically -->
        </div>
        <div class="add-card" id="add-in-progress">
          <i class="fas fa-plus-circle mr-1 text-green-500"></i>
          Add card
        </div>
      </div>

      <!-- Review Column -->
      <div class="kanban-column bg-white rounded-lg shadow-md p-4">
        <h2 class="column-title">
          <i class="fas fa-search icon text-purple-600"></i>
          Review
        </h2>
        <div id="review" class="space-y-2">
          <!-- Cards will be added here dynamically -->
        </div>
        <div class="add-card" id="add-review">
          <i class="fas fa-plus-circle mr-1 text-green-500"></i>
          Add card
        </div>
      </div>

      <!-- Done Column -->
      <div class="kanban-column bg-white rounded-lg shadow-md p-4">
        <h2 class="column-title">
          <i class="fas fa-check-circle icon text-green-600"></i>
          Done
        </h2>
        <div id="done" class="space-y-2">
          <!-- Cards will be added here dynamically -->
        </div>
        <div class="add-card" id="add-done">
          <i class="fas fa-plus-circle mr-1 text-green-500"></i>
          Add card
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript for Kanban Logic -->
  <script>
    // Namespace for localStorage to avoid conflicts
    const KANBAN_NAMESPACE = 'kanban-board-v1';

    // DOM elements
    const columns = {
      backlog: document.getElementById('backlog'),
      'in-progress': document.getElementById('in-progress'),
      review: document.getElementById('review'),
      done: document.getElementById('done')
    };

    const addButtons = {
      backlog: document.getElementById('add-backlog'),
      'in-progress': document.getElementById('add-in-progress'),
      review: document.getElementById('add-review'),
      done: document.getElementById('add-done')
    };

    // Confetti elements
    const confettiElement = document.getElementById('confetti');

    // Load saved state from localStorage
    function loadKanbanData() {
      const savedData = localStorage.getItem(KANBAN_NAMESPACE);
      if (savedData) {
        return JSON.parse(savedData);
      } else {
        // Return default dummy data if none exists
        return {
          backlog: [
            { id: '1', title: 'Design user interface', status: 'backlog' },
            { id: '2', title: 'Set up development environment', status: 'backlog' }
          ],
          'in-progress': [
            { id: '3', title: 'Implement login functionality', status: 'in-progress' }
          ],
          review: [
            { id: '4', title: 'Code review for authentication', status: 'review' }
          ],
          done: [
            { id: '5', title: 'Deploy to staging', status: 'done' },
            { id: '6', title: 'Write documentation', status: 'done' }
          ]
        };
      }
    }

    // Save state to localStorage
    function saveKanbanData(data) {
      localStorage.setItem(KANBAN_NAMESPACE, JSON.stringify(data));
    }

    // Generate random ID for new cards
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    // Create card element
    function createCardElement(cardData) {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('draggable', 'true');
      card.setAttribute('data-id', cardData.id);
      card.setAttribute('data-status', cardData.status);

      // Create the inner HTML for the card
      card.innerHTML = `
        <div class="card-header">
          <div class="card-title">${escapeHtml(cardData.title)}</div>
          <div class="card-actions">
            <button class="edit" title="Edit card">
              <i class="fas fa-edit text-blue-600"></i>
            </button>
            <button class="delete" title="Delete card">
              <i class="fas fa-trash text-red-500"></i>
            </button>
          </div>
        </div>
      `;

      // Add event listeners
      card.addEventListener('dragstart', handleDragStart);
      card.addEventListener('dragend', handleDragEnd);
      card.addEventListener('click', handleCardClick);

      // Attach event listeners to buttons
      const editButton = card.querySelector('.edit');
      const deleteButton = card.querySelector('.delete');

      editButton.addEventListener('click', (e) => {
        e.stopPropagation();
        editCard(cardData.id);
      });

      deleteButton.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteCard(cardData.id);
      });

      return card;
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Handle card click to enable editing
    function handleCardClick(e) {
      e.stopPropagation();
      const card = e.currentTarget;
      const titleElement = card.querySelector('.card-title');
      const isEditing = card.classList.contains('editing');

      // If not editing, enable editing
      if (!isEditing) {
        // Store original text
        card.dataset.originalText = titleElement.textContent;
        card.classList.add('editing');
        titleElement.setAttribute('contenteditable', 'true');
        titleElement.focus();
        titleElement.select();
      }
    }

    // Handle drag start
    function handleDragStart(e) {
      const card = e.currentTarget;
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    }

    // Handle drag end
    function handleDragEnd(e) {
      const card = e.currentTarget;
      card.classList.remove('dragging');
      card.classList.remove('editing');
      const titleElement = card.querySelector('.card-title');
      if (titleElement.hasAttribute('contenteditable')) {
        titleElement.removeAttribute('contenteditable');
      }
    }

    // Handle card editing
    function editCard(cardId) {
      const card = document.querySelector(`[data-id="${cardId}"]`);
      const titleElement = card.querySelector('.card-title');
      const isEditing = card.classList.contains('editing');

      if (isEditing) {
        // Cancel editing
        titleElement.removeAttribute('contenteditable');
        card.classList.remove('editing');
        return;
      }

      // Start editing
      titleElement.setAttribute('contenteditable', 'true');
      card.classList.add('editing');
      titleElement.focus();
      titleElement.select();
    }

    // Handle card editing save
    document.addEventListener('click', function(e) {
      const titleElement = e.target.closest('.card-title');
      if (!titleElement) return;

      const card = titleElement.closest('.card');
      if (!card || !card.classList.contains('editing')) return;

      const newTitle = titleElement.textContent.trim();
      const originalText = card.dataset.originalText || '';
      const cardId = card.dataset.id;

      // Exit if no change
      if (newTitle === originalText) {
        titleElement.removeAttribute('contenteditable');
        card.classList.remove('editing');
        return;
      }

      // Update the card and data
      if (newTitle === '') {
        alert('Card title cannot be empty!');
        return;
      }

      // Update the in-memory data
      const data = loadKanbanData();
      const status = card.dataset.status;
      const cardIndex = data[status].findIndex(c => c.id === cardId);
      if (cardIndex !== -1) {
        data[status][cardIndex].title = newTitle;
        saveKanbanData(data);
      }

      // Update UI
      titleElement.removeAttribute('contenteditable');
      card.classList.remove('editing');
      card.dataset.originalText = newTitle;
    });

    // Handle delete card
    function deleteCard(cardId) {
      const card = document.querySelector(`[data-id="${cardId}"]`);
      if (!card) return;

      // Show confirmation
      if (!confirm('Are you sure you want to delete this card? This action cannot be undone.')) {
        return;
      }

      // Get the card's status
      const status = card.dataset.status;
      const data = loadKanbanData();

      // Remove from data
      const index = data[status].findIndex(c => c.id === cardId);
      if (index !== -1) {
        data[status].splice(index, 1);
        saveKanbanData(data);
      }

      // Remove from DOM
      card.remove();
    }

    // Handle column drop
    function handleDrop(e) {
      e.preventDefault();
      const cardId = e.dataTransfer.getData('text/plain');
      const card = document.querySelector(`[data-id="${cardId}"]`);
      const targetColumn = e.currentTarget.id;
      const sourceColumn = card.dataset.status;

      // Check if moving to same column
      if (targetColumn === sourceColumn) {
        return;
      }

      // Update the card's status and move it
      const data = loadKanbanData();
      const cardIndex = data[sourceColumn].findIndex(c => c.id === cardId);
      if (cardIndex !== -1) {
        // Update the card object
        data[targetColumn].push(data[sourceColumn].splice(cardIndex, 1)[0]);
        saveKanbanData(data);
      }

      // Update UI
      card.dataset.status = targetColumn;
      const targetColumnElement = document.getElementById(targetColumn);
      targetColumnElement.appendChild(card);

      // Check if moved to "Done" column and trigger confetti
      if (targetColumn === 'done') {
        showConfetti();
      }
    }

    // Show confetti animation
    function showConfetti() {
      confettiElement.classList.add('active');
      // Create 50 confetti pieces
      for (let i = 0; i < 50; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.top = Math.random() * 100 + 'vh';
        piece.style.backgroundColor = getRandomColor();
        piece.style.width = Math.random() * 10 + 5 + 'px';
        piece.style.height = piece.style.width;
        piece.style.animationDuration = Math.random() * 3 + 2 + 's';
        piece.style.opacity = Math.random() * 0.8 + 0.2;
        confettiElement.appendChild(piece);
      }

      // Remove confetti after animation
      setTimeout(() => {
        confettiElement.classList.remove('active');
        confettiElement.innerHTML = '';
      }, 3000);
    }

    // Get random color for confetti
    function getRandomColor() {
      const colors = ['#fbbf24', '#ec4899', '#06b6d4', '#10b981', '#8b5cf6', '#f59e0b'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    // Add event listeners for drop zones
    Object.keys(columns).forEach(colId => {
      const col = columns[colId];
      col.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });
      col.addEventListener('drop', handleDrop);
    });

    // Add event listeners for add buttons
    Object.keys(addButtons).forEach(colId => {
      addButtons[colId].addEventListener('click', function(e) {
        e.preventDefault();
        const newCardTitle = prompt('Enter card title:');
        if (newCardTitle === null || newCardTitle.trim() === '') return;

        const data = loadKanbanData();
        const newCard = {
          id: generateId(),
          title: newCardTitle.trim(),
          status: colId
        };

        data[colId].push(newCard);
        saveKanbanData(data);

        // Add to DOM
        const cardElement = createCardElement(newCard);
        columns[colId].appendChild(cardElement);
      });
    });

    // Initialize the board
    function initKanban() {
      const data = loadKanbanData();

      // Populate the board
      Object.keys(columns).forEach(colId => {
        const columnData = data[colId] || [];
        columnData.forEach(card => {
          const cardElement = createCardElement(card);
          columns[colId].appendChild(cardElement);
        });
      });
    }

    // Start the app
    initKanban();
  </script>
</body>
</html>
