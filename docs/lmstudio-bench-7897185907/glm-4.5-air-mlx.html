<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom styles for animations and transitions -->
    <style>
        /* Card transition */
        .card {
            transition: all 0.3s ease;
        }
        
        /* Highlight when dragging */
        .dragging {
            opacity: 0.5;
        }
        
        /* Drop zone highlight */
        .drag-over {
            background-color: rgba(99, 102, 241, 0.2);
        }
        
        /* Editable card */
        .editable {
            cursor: pointer;
        }
        
        /* Confetti animation */
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 9999;
        }
        
        /* Modal styles */
        .modal {
            transition: opacity 0.3s ease;
        }
        
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(99, 102, 241, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Kanban Board</h1>
            <div id="cardCount" class="text-sm bg-indigo-700 px-3 py-1 rounded-full">
                0 cards
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="container mx-auto p-4">
        <div id="board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Columns will be dynamically generated here -->
        </div>
    </main>

    <!-- Delete Confirmation Modal (hidden by default) -->
    <div id="deleteModal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
            <h3 class="text-lg font-semibold mb-4">Delete Card</h3>
            <p class="mb-6">Are you sure you want to delete this card? This action cannot be undone.</p>
            <div class="flex justify-end space-x-3">
                <button id="cancelDelete" class="px-4 py-2 bg-gray-200 rounded-md hover:bg-gray-300 transition-colors">
                    Cancel
                </button>
                <button id="confirmDelete" class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Card Modal (hidden by default) -->
    <div id="editModal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full">
            <h3 class="text-lg font-semibold mb-4">Edit Card</h3>
            <textarea id="cardTitle" class="w-full p-2 border rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" rows="3"></textarea>
            <div class="flex justify-end space-x-3">
                <button id="cancelEdit" class="px-4 py-2 bg-gray-200 rounded-md hover:bg-gray-300 transition-colors">
                    Cancel
                </button>
                <button id="saveEdit" class="px-4 py-2 bg-indigo-500 text-white rounded-md hover:bg-indigo-600 transition-colors">
                    Save
                </button>
            </div>
        </div>
    </div>

    <!-- Add Card Modal (hidden by default) -->
    <div id="addModal" class="modal fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full">
            <h3 class="text-lg font-semibold mb-4">Add New Card</h3>
            <textarea id="newCardTitle" class="w-full p-2 border rounded-md mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" rows="3" placeholder="Enter card title..."></textarea>
            <div class="flex justify-end space-x-3">
                <button id="cancelAdd" class="px-4 py-2 bg-gray-200 rounded-md hover:bg-gray-300 transition-colors">
                    Cancel
                </button>
                <button id="saveAdd" class="px-4 py-2 bg-indigo-500 text-white rounded-md hover:bg-indigo-600 transition-colors">
                    Add
                </button>
            </div>
        </div>
    </div>

    <script>
        // Define columns configuration
        const COLUMNS = [
            { id: 'backlog', title: 'Backlog', color: 'bg-gray-200' },
            { id: 'in-progress', title: 'In Progress', color: 'bg-blue-200' },
            { id: 'review', title: 'Review', color: 'bg-yellow-200' },
            { id: 'done', title: 'Done', color: 'bg-green-200' }
        ];

        // Define localStorage namespace
        const STORAGE_NAMESPACE = 'kanban_board';

        // Card class to represent individual cards
        class Card {
            constructor(id, title, columnId) {
                this.id = id;
                this.title = title;
                this.columnId = columnId;
            }
        }

        // KanbanBoard class to manage the state and UI
        class KanbanBoard {
            constructor() {
                // Initialize cards array from localStorage or with dummy data
                this.cards = this.loadCards();
                
                // Track card being deleted for confirmation modal
                this.cardToDelete = null;
                
                // Track card being edited
                this.cardToEdit = null;
                
                // Track column where adding a new card
                this.columnToAddCard = null;
                
                // Initialize the board UI
                this.init();
            }

            /**
             * Load cards from localStorage or create dummy data if none exist
             */
            loadCards() {
                const saved = localStorage.getItem(STORAGE_NAMESPACE);
                
                if (saved) {
                    // Parse saved cards
                    return JSON.parse(saved).map(card => new Card(
                        card.id,
                        card.title,
                        card.columnId
                    ));
                } else {
                    // Create dummy cards if none exist
                    return [
                        new Card(this.generateId(), 'Create project proposal', 'backlog'),
                        new Card(this.generateId(), 'Design user interface', 'backlog'),
                        new Card(this.generateId(), 'Implement authentication', 'in-progress'),
                        new Card(this.generateId(), 'Write unit tests', 'review'),
                        new Card(this.generateId(), 'Fix responsive design issues', 'in-progress')
                    ];
                }
            }

            /**
             * Save cards to localStorage
             */
            saveCards() {
                const data = this.cards.map(card => ({
                    id: card.id,
                    title: card.title,
                    columnId: card.columnId
                }));
                
                localStorage.setItem(STORAGE_NAMESPACE, JSON.stringify(data));
            }

            /**
             * Generate a unique ID for cards
             */
            generateId() {
                return 'card_' + Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            /**
             * Initialize the board UI
             */
            init() {
                // Create columns in the DOM
                const board = document.getElementById('board');
                
                COLUMNS.forEach(column => {
                    // Create column container
                    const columnDiv = document.createElement('div');
                    columnDiv.className = 'bg-white rounded-lg shadow-md p-4 flex flex-col';
                    columnDiv.dataset.columnId = column.id;
                    
                    // Create column header
                    const headerDiv = document.createElement('div');
                    headerDiv.className = `flex justify-between items-center mb-4 ${column.color} p-2 rounded-t-lg`;
                    
                    const titleDiv = document.createElement('h2');
                    titleDiv.className = 'font-semibold';
                    titleDiv.textContent = column.title;
                    
                    const countDiv = document.createElement('div');
                    countDiv.className = 'bg-white rounded-full px-2 py-1 text-xs font-medium';
                    countDiv.id = `count-${column.id}`;
                    
                    headerDiv.appendChild(titleDiv);
                    headerDiv.appendChild(countDiv);
                    
                    // Create cards container
                    const cardsContainer = document.createElement('div');
                    cardsContainer.className = 'flex-grow overflow-y-auto custom-scrollbar space-y-3';
                    cardsContainer.id = `cards-${column.id}`;
                    
                    // Create add card button
                    const addButton = document.createElement('button');
                    addButton.className = 'mt-auto w-full py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200 transition-colors flex items-center justify-center';
                    addButton.innerHTML = '<svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>Add Card';
                    addButton.onclick = () => this.showAddCardModal(column.id);
                    
                    // Assemble column
                    columnDiv.appendChild(headerDiv);
                    columnDiv.appendChild(cardsContainer);
                    columnDiv.appendChild(addButton);
                    
                    // Add to board
                    board.appendChild(columnDiv);
                });
                
                // Populate cards in each column
                this.renderCards();
                
                // Update card count in header and columns
                this.updateCardCounts();
                
                // Set up drag and drop
                this.setupDragAndDrop();
            }

            /**
             * Render cards in their respective columns
             */
            renderCards() {
                // Clear all cards containers
                COLUMNS.forEach(column => {
                    const container = document.getElementById(`cards-${column.id}`);
                    container.innerHTML = '';
                });
                
                // Render each card in its column
                this.cards.forEach(card => {
                    const cardElement = this.createCardElement(card);
                    const container = document.getElementById(`cards-${card.columnId}`);
                    if (container) {
                        container.appendChild(cardElement);
                    }
                });
            }

            /**
             * Create DOM element for a card
             */
            createCardElement(card) {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card bg-white p-3 rounded-md shadow cursor-move hover:shadow-lg';
                cardDiv.draggable = true;
                cardDiv.dataset.cardId = card.id;
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'editable text-gray-800 mb-2';
                titleDiv.textContent = card.title;
                
                const deleteButton = document.createElement('button');
                deleteButton.className = 'text-red-500 hover:text-red-700 text-sm';
                deleteButton.innerHTML = '<svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                deleteButton.onclick = (e) => {
                    e.stopPropagation();
                    this.showDeleteCardModal(card);
                };
                
                cardDiv.appendChild(titleDiv);
                cardDiv.appendChild(deleteButton);
                
                return cardDiv;
            }

            /**
             * Update card counts in header and columns
             */
            updateCardCounts() {
                // Update total count in header
                const totalCount = this.cards.length;
                document.getElementById('cardCount').textContent = `${totalCount} card${totalCount !== 1 ? 's' : ''}`;
                
                // Update counts in each column
                COLUMNS.forEach(column => {
                    const count = this.cards.filter(card => card.columnId === column.id).length;
                    const counter = document.getElementById(`count-${column.id}`);
                    if (counter) {
                        counter.textContent = count;
                    }
                });
            }

            /**
             * Set up drag and drop functionality
             */
            setupDragAndDrop() {
                // Add event listeners for card drag start and end
                document.addEventListener('dragstart', (e) => {
                    if (e.target.classList.contains('card')) {
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', e.target.dataset.cardId);
                        e.target.classList.add('dragging');
                    }
                });
                
                document.addEventListener('dragend', (e) => {
                    if (e.target.classList.contains('card')) {
                        e.target.classList.remove('dragging');
                    }
                });
                
                // Add event listeners for column drop zones
                COLUMNS.forEach(column => {
                    const columnDiv = document.querySelector(`[data-column-id="${column.id}"]`);
                    
                    // Prevent default to allow drop
                    columnDiv.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        columnDiv.classList.add('drag-over');
                    });
                    
                    // Remove highlight when dragging leaves
                    columnDiv.addEventListener('dragleave', (e) => {
                        // Only remove if we're actually leaving the column, not just dragging over a child element
                        if (e.target === columnDiv) {
                            columnDiv.classList.remove('drag-over');
                        }
                    });
                    
                    // Handle drop
                    columnDiv.addEventListener('drop', (e) => {
                        e.preventDefault();
                        
                        const cardId = e.dataTransfer.getData('text/plain');
                        const newColumnId = column.id;
                        
                        // Move card to the new column
                        this.moveCard(cardId, newColumnId);
                        
                        // Remove highlight
                        columnDiv.classList.remove('drag-over');
                    });
                });
            }

            /**
             * Move a card to a new column
             */
            moveCard(cardId, newColumnId) {
                const cardIndex = this.cards.findIndex(card => card.id === cardId);
                
                if (cardIndex !== -1) {
                    // Update the card's column
                    const oldColumnId = this.cards[cardIndex].columnId;
                    this.cards[cardIndex].columnId = newColumnId;
                    
                    // Save to localStorage
                    this.saveCards();
                    
                    // Re-render cards
                    this.renderCards();
                    this.updateCardCounts();
                    
                    // Trigger confetti animation if moved to Done column
                    if (newColumnId === 'done' && oldColumnId !== 'done') {
                        this.triggerConfetti();
                    }
                }
            }

            /**
             * Show delete confirmation modal
             */
            showDeleteCardModal(card) {
                this.cardToDelete = card;
                
                const modal = document.getElementById('deleteModal');
                modal.classList.remove('hidden');
            }

            /**
             * Delete a card
             */
            deleteCard(cardId) {
                // Remove the card from the array
                this.cards = this.cards.filter(card => card.id !== cardId);
                
                // Save to localStorage
                this.saveCards();
                
                // Re-render cards and update counts
                this.renderCards();
                this.updateCardCounts();
            }

            /**
             * Show add card modal
             */
            showAddCardModal(columnId) {
                this.columnToAddCard = columnId;
                
                const modal = document.getElementById('addModal');
                modal.classList.remove('hidden');
                
                // Focus on the textarea
                const textarea = document.getElementById('newCardTitle');
                textarea.value = '';
                textarea.focus();
            }

            /**
             * Add a new card
             */
            addCard(title, columnId) {
                if (title.trim() !== '') {
                    const newCard = new Card(
                        this.generateId(),
                        title.trim(),
                        columnId
                    );
                    
                    // Add to the array
                    this.cards.push(newCard);
                    
                    // Save to localStorage
                    this.saveCards();
                    
                    // Re-render cards and update counts
                    this.renderCards();
                    this.updateCardCounts();
                }
            }

            /**
             * Show edit card modal
             */
            showEditCardModal(card) {
                this.cardToEdit = card;
                
                const modal = document.getElementById('editModal');
                modal.classList.remove('hidden');
                
                // Set the textarea value
                const textarea = document.getElementById('cardTitle');
                textarea.value = card.title;
                
                // Focus on the textarea
                textarea.focus();
            }

            /**
             * Update a card's title
             */
            updateCard(cardId, newTitle) {
                const cardIndex = this.cards.findIndex(card => card.id === cardId);
                
                if (cardIndex !== -1) {
                    this.cards[cardIndex].title = newTitle.trim();
                    
                    // Save to localStorage
                    this.saveCards();
                    
                    // Re-render cards
                    this.renderCards();
                }
            }

            /**
             * Trigger confetti animation for completed tasks
             */
            triggerConfetti() {
                const colors = ['#FF5252', '#FFD740', '#69F0AE', '#448AFF', '#E040FB'];
                const confettiCount = 100;
                
                for (let i = 0; i < confettiCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    
                    // Random color
                    const colorIndex = Math.floor(Math.random() * colors.length);
                    confetti.style.backgroundColor = colors[colorIndex];
                    
                    // Random shape (square or circle)
                    if (Math.random() > 0.5) {
                        confetti.style.borderRadius = '50%';
                    }
                    
                    // Random position and animation duration
                    confetti.style.left = `${Math.random() * 100}%`;
                    const duration = Math.random() * 3 + 2; // Between 2 and 5 seconds
                    confetti.style.animation = `confetti-fall ${duration}s linear forwards`;
                    
                    document.body.appendChild(confetti);
                    
                    // Remove confetti after animation
                    setTimeout(() => {
                        confetti.remove();
                    }, duration * 1000);
                }
            }

            /**
             * Close all modals
             */
            closeAllModals() {
                document.getElementById('deleteModal').classList.add('hidden');
                document.getElementById('editModal').classList.add('hidden');
                document.getElementById('addModal').classList.add('hidden');
            }
        }

        // Initialize the board when DOM is fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            const board = new KanbanBoard();
            
            // Set up event listeners for modals
            
            // Delete card modal
            document.getElementById('cancelDelete').addEventListener('click', () => {
                board.closeAllModals();
            });
            
            document.getElementById('confirmDelete').addEventListener('click', () => {
                if (board.cardToDelete) {
                    board.deleteCard(board.cardToDelete.id);
                    board.closeAllModals();
                }
            });
            
            // Edit card modal
            document.getElementById('cancelEdit').addEventListener('click', () => {
                board.closeAllModals();
            });
            
            document.getElementById('saveEdit').addEventListener('click', () => {
                if (board.cardToEdit) {
                    const newTitle = document.getElementById('cardTitle').value;
                    board.updateCard(board.cardToEdit.id, newTitle);
                    board.closeAllModals();
                }
            });
            
            // Add card modal
            document.getElementById('cancelAdd').addEventListener('click', () => {
                board.closeAllModals();
            });
            
            document.getElementById('saveAdd').addEventListener('click', () => {
                if (board.columnToAddCard) {
                    const newTitle = document.getElementById('newCardTitle').value;
                    board.addCard(newTitle, board.columnToAddCard);
                    board.closeAllModals();
                }
            });
            
            // Handle card title clicks to edit
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('editable')) {
                    const cardElement = e.target.closest('.card');
                    if (cardElement) {
                        const cardId = cardElement.dataset.cardId;
                        const card = board.cards.find(c => c.id === cardId);
                        
                        if (card) {
                            // Show edit modal
                            board.showEditCardModal(card);
                        }
                    }
                }
            });
            
            // Close modals when clicking outside
            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        board.closeAllModals();
                    }
                });
            });
            
            // Handle Enter key in modals
            document.getElementById('cardTitle').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('saveEdit').click();
                }
            });
            
            document.getElementById('newCardTitle').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('saveAdd').click();
                }
            });
        });
    </script>
</body>
</html>
